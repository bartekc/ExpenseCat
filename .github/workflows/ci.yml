name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run test:unit
      - run: npm run lint
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Run expense storage RLS smoke
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" npm run smoke:storage
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  deploy-preview:
    name: Deploy preview Worker
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          CLOUDFLARE_ENV: preview
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: placeholder-anon-key
      - name: Apply preview Supabase migrations
        run: npx supabase db push --include-all --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy preview Worker
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy --env preview 2>&1 | tee deploy.log
          preview_url=$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' deploy.log | tail -n 1)
          if [ -z "$preview_url" ]; then
            echo "Wrangler did not report a workers.dev URL" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployment"
            echo "URL: $preview_url"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check preview runtime secrets
        id: runtime-secrets
        run: |
          secrets=$(npx wrangler secret list --env preview)
          if printf '%s' "$secrets" | jq -e 'map(.name) | contains(["SUPABASE_URL", "SUPABASE_KEY"])' > /dev/null; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check missing-secret behavior
        if: steps.runtime-secrets.outputs.configured != 'true'
        run: npm run smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECT_UNCONFIGURED: "true"
      - name: Smoke test preview auth flow
        if: steps.runtime-secrets.outputs.configured == 'true'
        run: npm run smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.preview_url }}

  deploy-production:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: placeholder-anon-key
      - name: Apply production Supabase migrations
        run: npx supabase db push --include-all --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: deploy
